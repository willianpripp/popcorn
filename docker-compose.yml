# Groceries. Same shape as the calendar's stack: app + postgres, loopback for
# tailscale serve and the path router, LAN for devices without tailscale
# (guests, the work MacBook at home).
services:
  db:
    image: postgres:17.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: popcorn
      POSTGRES_PASSWORD: ${POP_DB_PASSWORD:?set POP_DB_PASSWORD in .env}
      POSTGRES_DB: popcorn
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popcorn"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POP_DSN: postgresql://popcorn:${POP_DB_PASSWORD}@db:5432/popcorn
      # THE SAME VALUES as the calendar's CAL_GATE_SECRET/CAL_GATE_USERS:
      # shared cookie, shared secret, one login across the household apps.
      GATE_SECRET: ${GATE_SECRET:-}
      GATE_USERS: ${GATE_USERS:-}
      POP_DEVICES: ${POP_DEVICES:-}
      POP_TMDB_KEY: ${POP_TMDB_KEY:-}
      POP_JF_KEY: ${POP_JF_KEY:-}
      POP_TELEGRAM_TOKEN: ${POP_TELEGRAM_TOKEN:-}
      POP_TELEGRAM_CHATS: ${POP_TELEGRAM_CHATS:-}
      TZ: America/New_York
    ports:
      # Loopback for tailscale serve (:8449) and the path router (/popcorn);
      # the LAN address for the home wifi tier, same as the calendar.
      - "127.0.0.1:3040:8000"
      - "192.0.2.251:3040:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s

volumes:
  dbdata:
